<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Video - Vid18+</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="detail.css" />
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="header-container">
      <div class="logo">
        <a href="index.html" style="text-decoration:none;">
          <h1>Vid18+</h1>
        </a>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="main-content">
    <div class="detail-container">

      <!-- Navigasi -->
      <div class="nav-buttons">
        <button class="back-btn" onclick="history.back()">← Kembali</button>
        <button class="home-btn" onclick="window.location.href='index.html'">🏠 Beranda</button>
      </div>

      <!-- Wrapper Video + Overlay Iklan -->
      <div class="video-wrapper">
        <!-- Overlay iklan (tampil sebelum play) -->
        <div id="ad-overlay" class="ad-overlay">
          <div class="ad-overlay-inner">
            <p class="ad-label">⚡ Konten siap diputar</p>
            <button id="play-with-ad" class="play-ad-btn">▶ Putar Video</button>
          </div>
        </div>
        <!-- Video Player -->
        <div class="video-container">
          <video id="video-player" class="video-player" controls preload="metadata"></video>
        </div>
      </div>

      <!-- Info Video -->
      <div class="video-info">
        <h1 id="video-title" class="video-title">Memuat...</h1>
        <div class="video-meta">
          <span id="video-views">▶ 0 penonton</span>
          <span id="video-category" class="video-category">—</span>
        </div>
        <p id="video-description" class="video-description"></p>
      </div>

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button id="share-btn" class="action-btn share-btn">
          <span class="btn-icon">📤</span>
          <span class="btn-text">Share</span>
        </button>
        <button id="download-btn" class="action-btn download-btn">
          <span class="btn-icon">⬇️</span>
          <span class="btn-text">Download</span>
        </button>
      </div>

      <!-- Related Videos -->
      <section class="related-videos">
        <h2 class="section-title">Video Lainnya</h2>
        <div id="related-grid" class="movies-grid">
          <div class="loading-movies">
            <div class="spinner"></div>
            <p>Memuat video lainnya...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script type="module" src="detail.js"></script>

  <!-- HilltopAds VATS: inject script saat tombol play diklik -->
  <script>
    (function () {
      var AD_URL  = 'https://aptpassage.com/dJmwF_z/d.GONRv/ZfGeUG/yeomn9OutZNUjl/kpPNTBYD3gMGDhM/4rM_DRYOteN/jGchweMYzlgMweN_wH';
      var adFired = false;
      var overlay = document.getElementById('ad-overlay');
      var playBtn = document.getElementById('play-with-ad');
      var player  = document.getElementById('video-player');

      function fireAd() {
        if (adFired) return;
        adFired = true;

        // CARA BENAR untuk VATS: sisipkan <script src="..."> ke halaman
        // Script HilltopAds akan merender unit iklan video secara otomatis
        var s = document.createElement('script');
        s.src   = AD_URL;
        s.async = true;
        s.onerror = function () {
          console.warn('Ad script failed to load');
        };
        document.body.appendChild(s);
      }

      // Klik tombol overlay → sembunyikan overlay, inject iklan, putar video
      if (playBtn) {
        playBtn.addEventListener('click', function () {
          fireAd();
          if (overlay) overlay.style.display = 'none';
          if (player)  player.play().catch(function () {});
        });
      }

      // Fallback: user klik kontrol native video langsung (bypass overlay)
      if (player) {
        player.addEventListener('play', fireAd, { once: true });
      }
    })();
  </script>

</body>
</html>
